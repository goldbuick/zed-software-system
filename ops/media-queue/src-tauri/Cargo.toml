[package]
name = "zed-cafe-media-queue"
version = "1.12.19"
description = "Local media-queue helper that PeerJS-calls zed.cafe (Tauri)"
authors = ["zed.cafe"]
edition = "2021"

[lib]
name = "zed_cafe_media_queue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
