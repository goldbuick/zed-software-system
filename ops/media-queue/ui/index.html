<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'; connect-src 'self' https://terminal.zed.cafe wss://terminal.zed.cafe; media-src 'self' blob: mediastream:"
    />
    <title>zed.cafe Media Queue</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./mq.css" />
  </head>
  <body>
    <div class="frame mq">
      <h1>zed.cafe <span>Media Queue</span></h1>
      <div class="sub">PeerJS helper for cafe #media board TV</div>

      <label for="localpeer">Your peer id (paste into cafe #media)</label>
      <div class="peerbox">
        <input
          id="localpeer"
          type="text"
          readonly
          spellcheck="false"
          autocomplete="off"
          value="starting..."
        />
        <button id="copypeer" type="button" class="action" disabled>
          Copy
        </button>
      </div>

      <label for="status">status</label>
      <div id="statusbox" class="status">
        <div>
          <span class="label">link</span>
          <span id="link" class="value">starting</span>
        </div>
        <div id="detail" class="mono"></div>
      </div>

      <label for="queue">queue (from cafe)</label>
      <textarea id="queue" readonly></textarea>

      <div class="row">
        <button id="opencapture" type="button">Recapture</button>
        <button id="stopcall" class="danger" type="button">Stop call</button>
        <button id="openbrowser" type="button">Open browser</button>
      </div>

      <video id="preview" muted playsinline autoplay></video>

      <div class="help">
        In cafe: <code>#media</code> -- paste the peer id above -- <code>Start</code>
        -- add URLs from the scroll.
        <br />
        Capture starts when cafe connects (use Recapture to pick again).
      </div>
    </div>
    <script src="./vendor/peerjs.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
