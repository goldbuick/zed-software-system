<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self' 'unsafe-eval'; img-src 'self' blob:; connect-src 'self' https://terminal.zed.cafe wss://terminal.zed.cafe https://asset.localhost; media-src 'self' blob: mediastream: https://asset.localhost"
    />
    <title>zed.cafe Media Queue</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./mq.css" />
  </head>
  <body>
    <div class="frame mq">
      <h1>zed.cafe <span>Media Queue</span></h1>
      <div class="sub">PeerJS helper for cafe board TV queue</div>

      <label for="localpeer">Your peer id</label>
      <div class="peerbox">
        <input
          id="localpeer"
          type="text"
          readonly
          spellcheck="false"
          autocomplete="off"
          value="starting..."
        />
        <button id="copypeer" type="button" class="action" disabled>
          Copy
        </button>
      </div>
      <div id="players" class="players">0 players</div>

      <label for="queue">queue (from cafe)</label>
      <textarea id="queue" readonly></textarea>

      <label for="cookiesbrowser">youtube cookies</label>
      <select id="cookiesbrowser"></select>
      <div id="cookieshint" class="cookieshint"></div>

      <div class="row">
        <button id="stopcall" class="danger" type="button">Stop call</button>
        <button id="cleardownloads" type="button" class="action">
          Clear downloads
        </button>
      </div>

      <video id="preview" muted playsinline autoplay></video>

      <div class="help">
        Cafe: <code>#queue &lt;peerid&gt;</code> to bind --
        <code>#media</code> for queue list, <code>#queue</code> for admin menu.
        Playback auto-starts on the first URL via yt-dlp download.
      </div>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
