[package]
name = "zed-cafe-youtube-relay"
version = "1.11.60"
description = "Local WHIP to YouTube RTMPS relay for zed.cafe (Tauri)"
authors = ["zed.cafe"]
edition = "2021"

[lib]
name = "zed_cafe_youtube_relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
tiny_http = "0.12"
thiserror = "2"
