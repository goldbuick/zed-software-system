name: Push Tag Release - Create Release Page

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{steps.github_release.outputs.changelog}}

  relay-macos:
    name: Build YouTube relay (macOS)
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Build macOS installers
        run: yarn task run relay:build:desktop:mac

      - name: Upload macOS artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ops/youtube-rtmp-relay/src-tauri/target/release/bundle/dmg/*.dmg

  relay-windows:
    name: Build YouTube relay (Windows)
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
      RELAY_NSIS_DIR: ops/youtube-rtmp-relay/src-tauri/target/release/bundle/nsis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Build Windows installer
        run: yarn task run relay:build:desktop:win

      - name: Locate NSIS installer
        id: locate-installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path $env:RELAY_NSIS_DIR -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found under $env:RELAY_NSIS_DIR"
          }
          "installer_path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: youtube-relay-windows-installer
          path: ${{ steps.locate-installer.outputs.installer_path }}
          archive: false

      - name: Sign Windows installer (SignPath)
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORG_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG_ID }}
          project-slug: zed-cafe-desktop
          signing-policy-slug: release-signing
          artifact-configuration-slug: youtube-relay-nsis
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ github.workspace }}/signed-artifacts
          skip-decompress: true

      - name: Upload signed Windows installer to release
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORG_ID != ''
        uses: softprops/action-gh-release@v3
        with:
          files: signed-artifacts/*.exe

      - name: Upload unsigned Windows installer to release
        if: env.SIGNPATH_API_TOKEN == '' || env.SIGNPATH_ORG_ID == ''
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.locate-installer.outputs.installer_path }}

  mediaqueue-macos:
    name: Build media queue (macOS)
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Build macOS installers
        run: yarn task run mediaqueue:build:desktop:mac

      - name: Upload macOS artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ops/media-queue/src-tauri/target/release/bundle/dmg/*.dmg

  mediaqueue-windows:
    name: Build media queue (Windows)
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
      MEDIAQUEUE_NSIS_DIR: ops/media-queue/src-tauri/target/release/bundle/nsis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Build Windows installer
        run: yarn task run mediaqueue:build:desktop:win

      - name: Locate NSIS installer
        id: locate-installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path $env:MEDIAQUEUE_NSIS_DIR -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer not found under $env:MEDIAQUEUE_NSIS_DIR"
          }
          "installer_path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: media-queue-windows-installer
          path: ${{ steps.locate-installer.outputs.installer_path }}
          archive: false

      - name: Sign Windows installer (SignPath)
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORG_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG_ID }}
          project-slug: zed-cafe-desktop
          signing-policy-slug: release-signing
          artifact-configuration-slug: media-queue-nsis
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ github.workspace }}/signed-artifacts
          skip-decompress: true

      - name: Upload signed Windows installer to release
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORG_ID != ''
        uses: softprops/action-gh-release@v3
        with:
          files: signed-artifacts/*.exe

      - name: Upload unsigned Windows installer to release
        if: env.SIGNPATH_API_TOKEN == '' || env.SIGNPATH_ORG_ID == ''
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.locate-installer.outputs.installer_path }}
