name: PR Check - Lint & Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint-and-test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ['ops:lint', 'ops:test', 'ops:native:lint']
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          set-safe-directory: true

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: install dependencies
        run: yarn install --frozen-lockfile

      - name: install clang-format
        if: matrix.task == 'ops:native:lint'
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: run ${{ matrix.task }}
        env:
          CLANG_FORMAT: clang-format-18
        run: yarn task run ${{ matrix.task }}

  docs-and-lang:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          set-safe-directory: true

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: install dependencies
        run: yarn install --frozen-lockfile

      - name: check task docs
        run: yarn task docs --check

      - name: check doc links
        run: yarn task run ops:docs:check-links

      - name: lang regression
        run: yarn task run ops:fixtures:lang:regression:test

      - name: content book build and validate
        run: |
          yarn task run ops:fixtures:content:book:build ops/fixtures/content/templates/minimal
          yarn task run ops:fixtures:content:book:validate ops/public/books/minimal.book.json
          yarn task run ops:fixtures:content:book:test
