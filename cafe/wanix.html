<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Wanix — ZSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <script type="module" crossorigin src="https://cdn.jsdelivr.net/npm/wanix@0.4.0-alpha8/dist/wanix.min.js"></script>
  <style>
    html,
    body, #wanix-host {
      height: 100vh;
      margin: 0;
    }
    #wanix-host wanix-system {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
    }
  </style>
</head>

<body>
  <div id="wanix-host"></div>
  <script type="module">
    const WANIX_MSG_READY = 'zss-wanix-ready'
    const WANIX_MSG_IDLE = 'zss-wanix-idle'
    const WANIX_MSG_RPC = 'zss-wanix-rpc'
    const WANIX_MSG_RPC_RES = 'zss-wanix-rpc-res'
    const WANIX_MSG_CELLS = 'zss-wanix-cells'

    const DEFAULT_TERM_COLS = 80
    const DEFAULT_TERM_ROWS = 24
    const GRID_FG = 15
    const GRID_BG = 0
    const GRID_SPACE = 32

    const WANIX_LINUX_URL =
      'https://cdn.jsdelivr.net/npm/wanix-extras@0.4.0-rc1/dist/wanix-linux.tgz'
    const WANIX_V86_URL =
      'https://cdn.jsdelivr.net/npm/wanix-extras@0.4.0-rc1/dist/v86.tgz'

    const DEFAULT_VM_ID = 'linux-vm'
    const DEFAULT_VM_MEM = '512M'
    const ROOM_READY_TIMEOUT_MS = 180_000
    const BIND_MOUNT_TIMEOUT_MS = 120_000
    const VM_RID_WAIT_MS = 120_000
    const TERM_CONNECT_TIMEOUT_MS = 30_000
    const POLL_MS = 250

    const host = document.getElementById('wanix-host')
    const termsessions = new Map()
    const termencoder = new TextEncoder()
    const termdecoder = new TextDecoder()

    function createtermgrid(cols, rows) {
      const nextcols = Math.max(1, cols)
      const nextrows = Math.max(1, rows)
      const size = nextcols * nextrows
      return {
        cols: nextcols,
        rows: nextrows,
        char: new Array(size).fill(GRID_SPACE),
        color: new Array(size).fill(GRID_FG),
        bg: new Array(size).fill(GRID_BG),
        cursorx: 0,
        cursory: 0,
        cursorvisible: true,
        lastcelldigest: '',
      }
    }

    function gridcellindex(grid, x, y) {
      if (x < 0 || y < 0 || x >= grid.cols || y >= grid.rows) {
        return -1
      }
      return x + y * grid.cols
    }

    function gridputcell(grid, x, y, ch, fg = GRID_FG, bg = GRID_BG) {
      const index = gridcellindex(grid, x, y)
      if (index < 0) {
        return
      }
      grid.char[index] = ch
      grid.color[index] = fg
      grid.bg[index] = bg
    }

    function gridscrollup(grid) {
      if (grid.rows <= 1) {
        return
      }
      const rowsize = grid.cols
      for (let y = 1; y < grid.rows; ++y) {
        for (let x = 0; x < rowsize; ++x) {
          const from = x + y * rowsize
          const to = x + (y - 1) * rowsize
          grid.char[to] = grid.char[from]
          grid.color[to] = grid.color[from]
          grid.bg[to] = grid.bg[from]
        }
      }
      const lastrow = (grid.rows - 1) * rowsize
      for (let x = 0; x < rowsize; ++x) {
        const index = lastrow + x
        grid.char[index] = GRID_SPACE
        grid.color[index] = GRID_FG
        grid.bg[index] = GRID_BG
      }
    }

    function gridnewline(grid) {
      grid.cursorx = 0
      if (grid.cursory >= grid.rows - 1) {
        gridscrollup(grid)
      } else {
        grid.cursory += 1
      }
    }

    function gridwritechar(grid, ch, fg = GRID_FG, bg = GRID_BG) {
      if (ch === 10) {
        gridnewline(grid)
        return
      }
      if (ch === 13) {
        grid.cursorx = 0
        return
      }
      if (ch === 8 || ch === 127) {
        if (grid.cursorx > 0) {
          grid.cursorx -= 1
          gridputcell(grid, grid.cursorx, grid.cursory, GRID_SPACE, fg, bg)
        }
        return
      }
      if (ch < 32 && ch !== 9) {
        return
      }
      if (ch === 9) {
        const tabstop = 8
        const next = Math.ceil((grid.cursorx + 1) / tabstop) * tabstop
        grid.cursorx = Math.min(next, Math.max(0, grid.cols - 1))
        return
      }
      gridputcell(grid, grid.cursorx, grid.cursory, ch, fg, bg)
      grid.cursorx += 1
      if (grid.cursorx >= grid.cols) {
        gridnewline(grid)
      }
    }

    function gridresetcells(grid) {
      grid.char.fill(GRID_SPACE)
      grid.color.fill(GRID_FG)
      grid.bg.fill(GRID_BG)
      grid.cursorx = 0
      grid.cursory = 0
      grid.cursorvisible = true
    }

    function gridparsecsi(grid, seq) {
      if (seq === '2J' || seq === 'H') {
        gridresetcells(grid)
        return
      }
      const cursor = /^(\d*);(\d*)H$/.exec(seq)
      if (cursor) {
        const row = Math.max(0, (parseInt(cursor[1] || '1', 10) || 1) - 1)
        const col = Math.max(0, (parseInt(cursor[2] || '1', 10) || 1) - 1)
        grid.cursory = Math.min(row, Math.max(0, grid.rows - 1))
        grid.cursorx = Math.min(col, Math.max(0, grid.cols - 1))
      }
    }

    function gridwritechunk(grid, chunk) {
      let i = 0
      while (i < chunk.length) {
        const ch = chunk.charCodeAt(i)
        if (ch === 27 && chunk.charCodeAt(i + 1) === 91) {
          i += 2
          let seq = ''
          while (i < chunk.length) {
            const code = chunk.charCodeAt(i)
            if (code >= 0x40 && code <= 0x7e) {
              seq += chunk[i]
              ++i
              break
            }
            seq += chunk[i]
            ++i
          }
          gridparsecsi(grid, seq)
          continue
        }
        gridwritechar(grid, ch)
        ++i
      }
    }

    function gridwritebytes(grid, bytes) {
      if (!bytes?.length) {
        return false
      }
      gridwritechunk(grid, termdecoder.decode(bytes))
      return true
    }

    function digestgridsnapshot(snapshot) {
      let hash = snapshot.cols * 65537 + snapshot.rows
      hash = hash * 31 + snapshot.cursorx
      hash = hash * 31 + snapshot.cursory
      hash = hash * 31 + (snapshot.cursorvisible ? 1 : 0)
      for (let i = 0; i < snapshot.char.length; i++) {
        hash = (hash * 33 + snapshot.char[i]) | 0
        hash = (hash * 33 + snapshot.color[i]) | 0
        hash = (hash * 33 + snapshot.bg[i]) | 0
      }
      return String(hash)
    }

    function readgridsnapshot(grid) {
      const snapshot = {
        cols: grid.cols,
        rows: grid.rows,
        char: [...grid.char],
        color: [...grid.color],
        bg: [...grid.bg],
        cursorx: grid.cursorx,
        cursory: grid.cursory,
        cursorvisible: grid.cursorvisible,
        digest: '',
      }
      snapshot.digest = digestgridsnapshot(snapshot)
      return snapshot
    }

    function postcells(sessionkey, session) {
      if (!session?.grid || session.grid.cols <= 0) {
        return
      }
      const snapshot = readgridsnapshot(session.grid)
      if (snapshot.digest === session.grid.lastcelldigest) {
        return
      }
      session.grid.lastcelldigest = snapshot.digest
      window.parent.postMessage(
        { type: WANIX_MSG_CELLS, sessionkey, snapshot },
        window.location.origin,
      )
    }

    function resizesessiongrid(sessionkey, session, cols, rows) {
      const nextcols = Math.max(1, Number(cols) || 1)
      const nextrows = Math.max(1, Number(rows) || 1)
      if (
        session.grid &&
        session.grid.cols === nextcols &&
        session.grid.rows === nextrows
      ) {
        return
      }
      session.grid = createtermgrid(nextcols, nextrows)
      postcells(sessionkey, session)
    }

    /** @type {import('zss/feature/wanix/wanixroomtypes').WanixRoomConfig} */
    let roomconfig = {
      mode: 'idle',
      mountkey: 0,
      archives: [],
      remotes: [],
      tasks: [],
    }
    let lastmountkey = -1
    /** @type {import('zss/feature/wanix/wanixelements.d.ts').WanixSystemElement | null} */
    let system = null

    function replyrpc(source, id, payload) {
      if (!source || typeof source.postMessage !== 'function') {
        return
      }
      source.postMessage(
        { type: WANIX_MSG_RPC_RES, id, ...payload },
        window.location.origin,
      )
    }

    function postready() {
      console.info('[wanix] ready')
      window.parent.postMessage(
        { type: WANIX_MSG_READY },
        window.location.origin,
      )
    }

    function postidle() {
      console.info('[wanix] idle')
      window.parent.postMessage(
        { type: WANIX_MSG_IDLE },
        window.location.origin,
      )
    }

    function setwanixattrs(el, attrs) {
      for (const [key, value] of Object.entries(attrs)) {
        if (value === undefined || value === false) {
          el.removeAttribute(key)
          continue
        }
        if (value === true || value === '') {
          el.setAttribute(key, '')
          continue
        }
        el.setAttribute(key, value)
      }
    }

    function createbind(attrs, markerattr) {
      const bind = document.createElement('wanix-bind')
      setwanixattrs(bind, attrs)
      if (markerattr) {
        bind.setAttribute(markerattr, '')
      }
      return bind
    }

    function readroot() {
      if (!system?.isReady) {
        throw new Error('wanix-system not ready')
      }
      return system.root
    }

    async function readtermloop(sessionkey, session) {
      while (session.alive && session.reader) {
        try {
          const { done, value } = await session.reader.read()
          if (done || !session.alive) {
            break
          }
          if (value?.length && session.grid) {
            gridwritebytes(session.grid, value)
            postcells(sessionkey, session)
          }
        } catch {
          break
        }
      }
    }

    function readupdateterminals() {
      if (!system?.isReady) {
        throw new Error('wanix-system not ready')
      }
      const updateterminals = system._updateTerminals
      if (typeof updateterminals !== 'function') {
        throw new Error('wanix _updateTerminals missing')
      }
      return updateterminals.bind(system)
    }

    async function fitonesession(sessionkey, session, cols, rows, updateterminals) {
      const nextcols = Math.max(1, Number(cols) || 1)
      const nextrows = Math.max(1, Number(rows) || 1)
      if (session.lastcols === nextcols && session.lastrows === nextrows) {
        return
      }
      session.lastcols = nextcols
      session.lastrows = nextrows
      const shim = {
        path: session.termpath,
        _term: { cols: nextcols, rows: nextrows },
      }
      updateterminals(shim)
      resizesessiongrid(sessionkey, session, nextcols, nextrows)
      console.info(`[wanix term ${sessionkey}] winsize`, {
        cols: nextcols,
        rows: nextrows,
        termpath: session.termpath,
      })
    }

    async function fitalltermsessions(cols, rows) {
      if (termsessions.size === 0) {
        return
      }
      const updateterminals = readupdateterminals()
      for (const [sessionkey, session] of termsessions) {
        await fitonesession(
          sessionkey,
          session,
          cols,
          rows,
          updateterminals,
        )
      }
    }

    function disconnecttermsession(sessionkey) {
      const session = termsessions.get(sessionkey)
      if (!session) {
        return
      }
      session.disconnect()
      termsessions.delete(sessionkey)
    }

    function disconnectalltermsessions() {
      for (const key of [...termsessions.keys()]) {
        disconnecttermsession(key)
      }
    }

    async function connecttermsession(sessionkey, termpath) {
      disconnecttermsession(sessionkey)
      const root = readroot()
      const datapath = `${termpath}/data`
      await root.waitFor(datapath, TERM_CONNECT_TIMEOUT_MS)
      const readable = await root.openReadable(datapath)
      const writable = await root.openWritable(datapath)
      const reader = readable.getReader()
      const writer = writable.getWriter()
      const session = {
        alive: true,
        termpath,
        lastcols: DEFAULT_TERM_COLS,
        lastrows: DEFAULT_TERM_ROWS,
        grid: createtermgrid(DEFAULT_TERM_COLS, DEFAULT_TERM_ROWS),
        reader,
        writer,
        async write(text) {
          if (!this.alive || !this.writer) {
            return
          }
          await this.writer.write(termencoder.encode(String(text ?? '')))
        },
        disconnect() {
          if (!this.alive) {
            return
          }
          this.alive = false
          if (this.reader) {
            this.reader.cancel().catch(() => {})
            this.reader = null
          }
          if (this.writer) {
            this.writer.close().catch(() => {})
            this.writer = null
          }
        },
      }
      termsessions.set(sessionkey, session)
      void readtermloop(sessionkey, session)
      return session
    }

    function readtermsession(sessionkey) {
      if (sessionkey != null && sessionkey !== '') {
        const session = termsessions.get(String(sessionkey))
        if (!session) {
          throw new Error(`wanix term session missing: ${sessionkey}`)
        }
        return session
      }
      const first = termsessions.values().next().value
      if (!first) {
        throw new Error('wanix term session missing')
      }
      return first
    }

    function readvmtermpath(vmel) {
      if (typeof vmel?.term === 'string' && vmel.term.length > 0) {
        return vmel.term
      }
      return '#vm/1/term'
    }

    async function connectvmtermsession() {
      const vm = roomconfig.vm
      if (!vm?.active || !system?.isReady) {
        return
      }
      const vmel = system.querySelector('wanix-vm')
      if (!vmel) {
        return
      }
      await connecttermsession(vm.id, readvmtermpath(vmel))
    }

    function appendtaskroombinds(sys, config) {
      sys.appendChild(createbind({ dst: '.', src: '#ramfs' }))
      for (const archive of config.archives) {
        const bind = createbind({
          type: 'archive',
          dst: archive.dst,
          src: archive.src,
        })
        bind.setAttribute('data-zss-archive-id', archive.id)
        sys.appendChild(bind)
      }
      for (const remote of config.remotes) {
        const bind = createbind(
          { type: 'import', dst: remote.dst, src: remote.url },
        )
        bind.setAttribute('data-zss-remote-id', remote.id)
        sys.appendChild(bind)
      }
    }

    function appendvmroombinds(sys) {
      sys.appendChild(
        createbind(
          { type: 'archive', dst: '.', src: WANIX_LINUX_URL },
          'data-zss-linux-bind',
        ),
      )
      sys.appendChild(createbind({ dst: 'vm', src: '#vm' }))
      sys.appendChild(
        createbind(
          { type: 'archive', dst: '#vm/v86', src: WANIX_V86_URL },
          'data-zss-v86-bind',
        ),
      )
    }

    function buildroomtree(config) {
      const sys = document.createElement('wanix-system')
      setwanixattrs(sys, {
        id: 'wanix-system',
        'allow-origins': '*',
        debug: true,
      })

      if (config.mode === 'idle') {
        return sys
      }

      appendtaskroombinds(sys, config)

      if (config.mode === 'vm') {
        appendvmroombinds(sys)
        const vm = config.vm
        if (vm?.active) {
          const vmel = document.createElement('wanix-vm')
          setwanixattrs(vmel, {
            id: vm.id,
            export: 'ttyS0',
            mem: vm.mem,
            term: true,
            start: true,
          })
          sys.appendChild(vmel)
        }
      }

      return sys
    }

    function waitsystemready(sys, timeoutms = ROOM_READY_TIMEOUT_MS) {
      if (sys.isReady) {
        return Promise.resolve()
      }
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          sys.removeEventListener('ready', onready)
          reject(new Error('wanix-system ready timeout'))
        }, timeoutms)
        const onready = () => {
          clearTimeout(timer)
          resolve()
        }
        sys.addEventListener('ready', onready, { once: true })
        sys.addEventListener(
          'error',
          () => {
            clearTimeout(timer)
            reject(new Error('wanix-system error'))
          },
          { once: true },
        )
      })
    }

    async function waitvmlinuxmount() {
      const deadline = Date.now() + BIND_MOUNT_TIMEOUT_MS
      while (Date.now() < deadline) {
        try {
          const entries = await readroot().readDir('.')
          if (entries.some((entry) => entry.startsWith('bin'))) {
            return
          }
        } catch {
          // root not ready for vm layout yet
        }
        await new Promise((resolve) => setTimeout(resolve, POLL_MS))
      }
      throw new Error('wanix vm binds not mounted')
    }

    async function waitforvmrid(vm, deadline) {
      while (Date.now() < deadline) {
        if (vm.rid) {
          return vm.rid
        }
        await new Promise((resolve) => setTimeout(resolve, POLL_MS))
      }
      return vm.rid ?? null
    }

    async function applyroom(config) {
      roomconfig = {
        mode: config.mode ?? 'idle',
        mountkey: config.mountkey ?? 0,
        archives: config.archives ?? [],
        remotes: config.remotes ?? [],
        tasks: config.tasks ?? [],
        vm: config.vm,
      }

      if (roomconfig.mode === 'idle') {
        disconnectalltermsessions()
        host.replaceChildren()
        system = null
        lastmountkey = roomconfig.mountkey
        postidle()
        return { ok: true, mode: 'idle', mountkey: lastmountkey }
      }

      if (
        lastmountkey === roomconfig.mountkey &&
        system?.isConnected &&
        system.isReady
      ) {
        return {
          ok: true,
          mode: roomconfig.mode,
          mountkey: lastmountkey,
          already: true,
        }
      }

      await customElements.whenDefined('wanix-system')
      disconnectalltermsessions()
      const next = buildroomtree(roomconfig)
      host.replaceChildren()
      host.appendChild(next)
      system = next
      lastmountkey = roomconfig.mountkey

      await waitsystemready(system)
      postready()

      if (roomconfig.mode === 'vm' && roomconfig.vm?.active) {
        await waitvmlinuxmount()
        const vm = system.querySelector('wanix-vm')
        const vrid = vm
          ? await waitforvmrid(vm, Date.now() + VM_RID_WAIT_MS)
          : null
        await connectvmtermsession()
        return {
          ok: true,
          mode: 'vm',
          mountkey: lastmountkey,
          vmid: roomconfig.vm.id,
          vrid,
          mem: roomconfig.vm.mem,
        }
      }

      return { ok: true, mode: roomconfig.mode, mountkey: lastmountkey }
    }

    function removetargetpair(taskid) {
      disconnecttermsession(taskid)
      system?.querySelector(`wanix-task[id="${taskid}"]`)?.remove()
      roomconfig.tasks = roomconfig.tasks.filter((entry) => entry.id !== taskid)
    }

    async function spawntask(taskid, cmd) {
      if (!system?.isReady) {
        throw new Error('wanix room not ready')
      }
      if (system.querySelector(`wanix-task[id="${taskid}"]`)) {
        return { ok: true, already: true, taskid }
      }

      const task = document.createElement('wanix-task')
      setwanixattrs(task, {
        id: taskid,
        type: 'wasi',
        term: true,
        cmd,
      })
      task.setAttribute('data-zss-target-id', taskid)
      task.setAttribute('data-zss-target-kind', 'task')
      system.appendChild(task)

      if (typeof task.allocate === 'function') {
        await task.allocate()
      }

      const termpath =
        typeof task.term === 'string' && task.term.length > 0
          ? task.term
          : `#task/${taskid}/term`
      await connecttermsession(taskid, termpath)

      if (typeof task.start === 'function') {
        await task.start()
      }

      const entry = { id: taskid, cmd, running: true }
      roomconfig.tasks = [...roomconfig.tasks.filter((t) => t.id !== taskid), entry]

      return { ok: true, taskid, rid: task.rid ?? null }
    }

    function halttask(taskid) {
      removetargetpair(taskid)
      return { ok: true, taskid }
    }

    function stopvm() {
      if (!system?.isReady) {
        throw new Error('wanix room not ready')
      }
      const vmid = roomconfig.vm?.id ?? DEFAULT_VM_ID
      disconnecttermsession(vmid)
      system.querySelector('wanix-vm')?.remove()
      system.querySelector('[data-zss-linux-bind]')?.remove()
      system.querySelector('[data-zss-v86-bind]')?.remove()
      for (const bind of system.querySelectorAll('wanix-bind')) {
        if (bind.getAttribute('dst') === 'vm') {
          bind.remove()
        }
      }
      roomconfig = {
        ...roomconfig,
        mode: 'task',
        vm: undefined,
      }
      return { ok: true, mode: 'task' }
    }

    function stoproom() {
      return applyroom({
        mode: 'idle',
        mountkey: roomconfig.mountkey + 1,
        archives: [],
        remotes: [],
        tasks: [],
      })
    }

    function readroomstatus() {
      return {
        ...roomconfig,
        ready: !!system?.isReady,
        vmrunning: !!system?.querySelector('wanix-vm[start], wanix-vm[start=""]'),
      }
    }

    function readvmstatelive() {
      const vm = system?.querySelector('wanix-vm')
      return {
        running: !!vm,
        vmid: vm?.getAttribute('id') ?? roomconfig.vm?.id ?? null,
        vrid: vm?.rid ?? null,
        mem: vm?.getAttribute('mem') ?? roomconfig.vm?.mem ?? null,
      }
    }

    async function handlerrpc(data, source) {
      const { id, method, args = [] } = data
      try {
        let result
        switch (method) {
          case 'ping':
            result = { ok: true }
            break
          case 'readready':
            result = {
              isReady: !!system?.isReady,
              instanceID: system?.instanceID ?? null,
            }
            break
          case 'readroomstatus':
            result = readroomstatus()
            break
          case 'readvmstatus':
            result = readvmstatelive()
            break
          case 'applyroom': {
            const [config] = args
            result = await applyroom(config ?? { mode: 'idle', mountkey: 0 })
            break
          }
          case 'spawntask': {
            const [taskid, cmd] = args
            result = await spawntask(String(taskid), String(cmd))
            break
          }
          case 'halttask': {
            const [taskid] = args
            result = halttask(String(taskid))
            break
          }
          case 'stoproom':
            result = await stoproom()
            break
          case 'startvm': {
            const [mem, vmid] = args
            result = await applyroom({
              ...roomconfig,
              mode: 'vm',
              mountkey: roomconfig.mountkey + 1,
              vm: {
                id: String(vmid ?? DEFAULT_VM_ID),
                mem: String(mem ?? DEFAULT_VM_MEM),
                active: true,
              },
            })
            break
          }
          case 'stopvm': {
            result = stopvm()
            break
          }
          case 'listdir': {
            const [path] = args
            result = await readroot().readDir(String(path ?? '.'))
            break
          }
          case 'readtext': {
            const [path] = args
            result = await readroot().readText(String(path))
            break
          }
          case 'readfile': {
            const [path] = args
            const bytes = await readroot().readFile(String(path))
            result = Array.from(bytes)
            break
          }
          case 'writefile': {
            const [path, bytes] = args
            await readroot().writeFile(
              String(path),
              new Uint8Array(bytes ?? []),
            )
            result = { ok: true }
            break
          }
          case 'termwrite': {
            const [linedata, sessionkey] = args
            const session = readtermsession(
              sessionkey != null ? String(sessionkey) : undefined,
            )
            await session.write(String(linedata ?? ''))
            result = { ok: true }
            break
          }
          case 'termfit': {
            const [cols, rows] = args
            if (termsessions.size === 0) {
              result = { ok: true, noop: true }
              break
            }
            await fitalltermsessions(Number(cols), Number(rows))
            result = {
              ok: true,
              cols: Number(cols),
              rows: Number(rows),
            }
            break
          }
          default:
            replyrpc(source, id, { error: `unknown rpc: ${method}` })
            return
        }
        replyrpc(source, id, { result })
      } catch (err) {
        const message = err instanceof Error ? err.message : String(err)
        if (method === 'termfit') {
          console.warn('[wanix termfit]', message)
        }
        replyrpc(source, id, {
          error: message,
        })
      }
    }

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) {
        return
      }
      const data = event.data
      if (!data || data.type !== WANIX_MSG_RPC) {
        return
      }
      void handlerrpc(data, event.source)
    })

    await customElements.whenDefined('wanix-system')
    postidle()
  </script>
</body>

</html>
