<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Wanix — ZSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <script type="module" crossorigin src="https://cdn.jsdelivr.net/npm/wanix@0.4.0-alpha8/dist/wanix.min.js"></script>
  <style>
    html,
    body {
      height: 100vh;
      margin: 0;
    }
  </style>
</head>

<body>
  <wanix-system id="wanix-system" allow-origins="*" debug></wanix-system>
  <script type="module">
    const WANIX_MSG_READY = 'zss-wanix-ready'
    const WANIX_MSG_RPC = 'zss-wanix-rpc'
    const WANIX_MSG_RPC_RES = 'zss-wanix-rpc-res'

    const WANIX_LINUX_URL =
      'https://cdn.jsdelivr.net/npm/wanix-extras@0.4.0-rc1/dist/wanix-linux.tgz'
    const WANIX_V86_URL =
      'https://cdn.jsdelivr.net/npm/wanix-extras@0.4.0-rc1/dist/v86.tgz'

    const DEFAULT_VM_ID = 'linux-vm'
    const DEFAULT_VM_MEM = '512M'
    const VM_RID_WAIT_MS = 120_000
    const VM_RID_POLL_MS = 250

    const sys = document.querySelector('wanix-system')

    const vmstate = {
      running: false,
      vmid: null,
      vrid: null,
      mem: null,
    }

    function replyrpc(source, id, payload) {
      if (!source || typeof source.postMessage !== 'function') {
        return
      }
      source.postMessage(
        { type: WANIX_MSG_RPC_RES, id, ...payload },
        window.location.origin,
      )
    }

    function readterm() {
      const term = document.querySelector('wanix-term')
      if (!term) {
        throw new Error('wanix-term missing')
      }
      return term
    }

    function readroot() {
      if (!sys?.isReady) {
        throw new Error('wanix-system not ready')
      }
      return sys.root
    }

    function setwanixattrs(el, attrs) {
      for (const [key, value] of Object.entries(attrs)) {
        if (value === undefined || value === false) {
          el.removeAttribute(key)
          continue
        }
        if (value === true || value === '') {
          el.setAttribute(key, '')
          continue
        }
        el.setAttribute(key, value)
      }
    }

    function readvmbyid(vmid) {
      return sys.querySelector(`wanix-vm[id="${vmid}"]`)
    }

    function readvmstatelive() {
      const vm = sys.querySelector('wanix-vm')
      const running = !!vm
      return {
        running,
        vmid: vm?.getAttribute('id') ?? vmstate.vmid,
        vrid: vm?.rid ?? vmstate.vrid,
        mem: vm?.getAttribute('mem') ?? vmstate.mem,
      }
    }

    function createarchivebind(marker, dst, src) {
      const bind = document.createElement('wanix-bind')
      bind.setAttribute(`data-zss-${marker}-bind`, '')
      setwanixattrs(bind, { dst, type: 'archive', src })
      return bind
    }

    function mountvmbinds() {
      if (!sys.querySelector('wanix-bind[data-zss-linux-bind]')) {
        sys.appendChild(createarchivebind('linux', '.', WANIX_LINUX_URL))
      }
      if (!sys.querySelector('wanix-bind[data-zss-v86-bind]')) {
        sys.appendChild(createarchivebind('v86', '#vm/v86', WANIX_V86_URL))
      }
    }

    function unmountvmbinds() {
      sys.querySelector('wanix-bind[data-zss-linux-bind]')?.remove()
      sys.querySelector('wanix-bind[data-zss-v86-bind]')?.remove()
    }

    async function waitvmbindmount() {
      mountvmbinds()
      const deadline = Date.now() + 60_000
      while (Date.now() < deadline) {
        try {
          const entries = await readroot().readDir('.')
          if (entries.some((entry) => entry.startsWith('bin'))) {
            return
          }
        } catch {
          // root not ready for vm layout yet
        }
        await new Promise((resolve) => setTimeout(resolve, VM_RID_POLL_MS))
      }
      throw new Error('wanix vm binds not mounted')
    }

    async function waitforvmrid(vm, deadline) {
      while (Date.now() < deadline) {
        if (vm.rid) {
          return vm.rid
        }
        await new Promise((resolve) => setTimeout(resolve, VM_RID_POLL_MS))
      }
      return vm.rid ?? null
    }

    async function startvm(mem = DEFAULT_VM_MEM, vmid = DEFAULT_VM_ID) {
      await customElements.whenDefined('wanix-system')
      if (!sys?.isReady) {
        throw new Error('wanix-system not ready')
      }
      await waitvmbindmount()
      const existing = readvmbyid(vmid)
      if (existing?.hasAttribute('start')) {
        const status = readvmstatelive()
        return { ok: true, already: true, ...status }
      }
      if (existing) {
        existing.remove()
      }
      sys.querySelector('wanix-term')?.remove()
      const vm = document.createElement('wanix-vm')
      setwanixattrs(vm, {
        id: vmid,
        export: 'ttyS0',
        mem,
        term: true,
        start: true,
      })
      sys.appendChild(vm)
      const term = document.createElement('wanix-term')
      setwanixattrs(term, {
        path: '#vm/1/term',
        raw: true,
      })
      sys.appendChild(term)
      const vrid = await waitforvmrid(vm, Date.now() + VM_RID_WAIT_MS)
      vmstate.running = true
      vmstate.vmid = vmid
      vmstate.vrid = vrid
      vmstate.mem = mem
      return { ok: true, vmid, vrid, mem }
    }

    function stopvm(vmid = DEFAULT_VM_ID) {
      const vm = readvmbyid(vmid) ?? sys.querySelector('wanix-vm')
      vm?.remove()
      sys.querySelector('wanix-term')?.remove()
      unmountvmbinds()
      vmstate.running = false
      vmstate.vmid = null
      vmstate.vrid = null
      vmstate.mem = null
      return { ok: true }
    }

    async function handlerrpc(data, source) {
      const { id, method, args = [] } = data
      try {
        let result
        switch (method) {
          case 'ping':
            result = { ok: true }
            break
          case 'readready':
            result = { isReady: sys.isReady, instanceID: sys.instanceID }
            break
          case 'readvmstatus':
            result = readvmstatelive()
            break
          case 'startvm': {
            const [mem, vmid] = args
            result = await startvm(
              String(mem ?? DEFAULT_VM_MEM),
              String(vmid ?? DEFAULT_VM_ID),
            )
            break
          }
          case 'stopvm': {
            const [vmid] = args
            result = stopvm(
              vmid ? String(vmid) : DEFAULT_VM_ID,
            )
            break
          }
          case 'listdir': {
            const [path] = args
            result = await readroot().readDir(String(path ?? '.'))
            break
          }
          case 'readtext': {
            const [path] = args
            result = await readroot().readText(String(path))
            break
          }
          case 'readfile': {
            const [path] = args
            const bytes = await readroot().readFile(String(path))
            result = Array.from(bytes)
            break
          }
          case 'writefile': {
            const [path, bytes] = args
            await readroot().writeFile(
              String(path),
              new Uint8Array(bytes ?? []),
            )
            result = { ok: true }
            break
          }
          case 'termwrite': {
            const [data] = args
            readterm().write(String(data ?? ''))
            result = { ok: true }
            break
          }
          case 'termfit':
            readterm().fit()
            result = { ok: true }
            break
          default:
            replyrpc(source, id, { error: `unknown rpc: ${method}` })
            return
        }
        replyrpc(source, id, { result })
      } catch (err) {
        replyrpc(source, id, {
          error: err instanceof Error ? err.message : String(err),
        })
      }
    }

    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) {
        return
      }
      const data = event.data
      if (!data || data.type !== WANIX_MSG_RPC) {
        return
      }
      void handlerrpc(data, event.source)
    })

    function postready() {
      console.info('[wanix] ready')
      window.parent.postMessage(
        { type: WANIX_MSG_READY },
        window.location.origin,
      )
    }

    sys.addEventListener('ready', postready)
    sys.addEventListener('error', (e) =>
      console.error('[wanix] error', e.detail),
    )

    await customElements.whenDefined('wanix-system')
    if (!sys.isReady) {
      mountvmbinds()
    }

    if (sys.isReady) {
      postready()
    }
  </script>
</body>

</html>
